# ============================================================================
#  PostgreSQL 16 - pg_hba.conf endurecido
#  - Solo conexiones TCP con TLS (hostssl) y scram-sha-256.
#  - postgres NO tiene entrada remota: solo socket local (peer).
#  - Cualquier conexion TCP sin SSL es rechazada.
# ============================================================================

# TYPE    DATABASE              USER          ADDRESS       METHOD
local     all                   all                         peer
local     postgres              all                         peer

hostssl   coop_horizonte_core   admin_dba     0.0.0.0/0     scram-sha-256
hostssl   coop_horizonte_core   admin_dba     ::/0          scram-sha-256
hostssl   coop_horizonte_core   app_core_rw   0.0.0.0/0     scram-sha-256
hostssl   coop_horizonte_core   app_core_rw   ::/0          scram-sha-256
hostssl   coop_horizonte_core   auditor_ro    0.0.0.0/0     scram-sha-256
hostssl   coop_horizonte_core   auditor_ro    ::/0          scram-sha-256
hostssl   coop_horizonte_core   migration_loader 0.0.0.0/0  scram-sha-256
hostssl   coop_horizonte_core   migration_loader ::/0       scram-sha-256

# Integrantes del equipo con perfil administrativo
hostssl   coop_horizonte_core   nicolas       0.0.0.0/0     scram-sha-256
hostssl   coop_horizonte_core   nicolas       ::/0          scram-sha-256
hostssl   coop_horizonte_core   joaquin       0.0.0.0/0     scram-sha-256
hostssl   coop_horizonte_core   joaquin       ::/0          scram-sha-256
hostssl   coop_horizonte_core   david         0.0.0.0/0     scram-sha-256
hostssl   coop_horizonte_core   david         ::/0          scram-sha-256
hostssl   coop_horizonte_core   gustavo       0.0.0.0/0     scram-sha-256
